# Nginx — Menu Livre
# Porta 8080: cardápio público  →  NPM roteia cardapio.seudominio.com.br → 8080
# Porta 8081: painel admin      →  NPM roteia admin.seudominio.com.br    → 8081
#
# Sem server_name — o roteamento por domínio fica no NPM (Nginx Proxy Manager).
# Este arquivo não contém dados de nenhum cliente.

# Cardápio público — porta 8080
server {
    listen 8080;

    root /usr/share/nginx/html/publico;
    index index.html;

    # API → uvicorn
    location /api/ {
        proxy_pass         http://host.docker.internal:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 10M;
    }

    # Uploads (imagens dos produtos)
    location /uploads/ {
        alias   /usr/share/nginx/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Frontend estático — $uri.html permite URLs sem extensão (ex: /dashboard)
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}

# Painel admin — porta 8081
server {
    listen 8081;

    root /usr/share/nginx/html/admin;
    index index.html;

    # API → uvicorn
    location /api/ {
        proxy_pass         http://host.docker.internal:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
