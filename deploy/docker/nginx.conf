# Nginx — Menu Livre
# Dois server blocks: cardápio público e painel admin
# Em produção: NPM (Nginx Proxy Manager) termina o SSL e repassa para este container na porta 8080.

# cardapio.paodemao.com.br — cardápio público
server {
    listen 80;
    server_name cardapio.paodemao.com.br;

    root /usr/share/nginx/html/publico;
    index index.html;

    # API → uvicorn (acesso pelo IP da bridge docker0)
    location /api/ {
        proxy_pass         http://172.17.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 10M;
    }

    # Uploads (imagens dos produtos) — Nginx serve direto, sem passar pelo uvicorn
    location /uploads/ {
        alias   /usr/share/nginx/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Frontend estático
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Segurança básica (SSL e CSP mais restrito ficam no NPM / HTTPS layer)
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}

# admin.paodemao.com.br — painel admin
