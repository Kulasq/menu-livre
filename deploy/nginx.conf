# Nginx — cardapio.paodemao.com.br
# Copiar para: /etc/nginx/sites-available/cardapio
# Ativar com: sudo ln -s /etc/nginx/sites-available/cardapio /etc/nginx/sites-enabled/
# SSL: sudo certbot --nginx -d cardapio.paodemao.com.br

server {
    listen 80;
    server_name cardapio.paodemao.com.br;

    root /var/www/menu-livre/frontend;

    # Redireciona raiz para o cardápio público
    location = / {
        return 301 /publico/;
    }

    # API → Uvicorn (nunca expor porta 8000 diretamente)
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 10M;
    }

    # Uploads (imagens dos produtos) — Nginx serve direto, sem passar pelo uvicorn
    location /uploads/ {
        alias   /var/www/menu-livre/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Frontend estático (admin + público)
    location / {
        try_files $uri $uri/ =404;
    }

    # Segurança
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
